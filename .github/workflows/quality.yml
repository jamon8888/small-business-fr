name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances du validateur
        run: pip install pyyaml
      - name: Porte de qualité (11 contrôles)
        run: python3 production_check.py
